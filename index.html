document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:linear-gradient(rgba(196,92,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(196,92,0,0.04) 1px, transparent 1px); background-size:40px 40px;\"><\u002Fdiv>\n          <div style=\"position:relative; max-width:560px; margin:0 auto;\">\n            <h2 style=\"margin:0 0 14px; font-family:'Orbitron',sans-serif; font-weight:900; font-size:clamp(28px,5vw,52px); color:#f2e7d8; letter-spacing:1px; text-align:center;\">ESTABLISH CONTACT<\u002Fh2>\n            <p style=\"font-size:15px; color:#9a9087; margin:0 0 30px; line-height:1.7; text-align:center;\">Open to ventures, security work, and builds worth shipping. Transmissions drop straight into my Notion command center.<\u002Fp>\n            <form id=\"ak-form\" onsubmit=\"{{ sendTransmission }}\" style=\"display:grid; gap:12px;\">\n              <input name=\"callsign\" required=\"\" placeholder=\"CALLSIGN / NAME\" style=\"background:#0b0a09; border:1px solid #2a2622; color:#e8d5c0; font-size:13px; letter-spacing:1.5px; padding:14px 16px; outline:none;\" style-focus=\"border-color:var(--accent,#ff7a1a);\">\n              <input name=\"channel\" type=\"email\" required=\"\" placeholder=\"RETURN CHANNEL / EMAIL\" style=\"background:#0b0a09; border:1px solid #2a2622; color:#e8d5c0; font-size:13px; letter-spacing:1.5px; padding:14px 16px; outline:none;\" style-focus=\"border-color:var(--accent,#ff7a1a);\">\n              <textarea name=\"msg\" required=\"\" placeholder=\"TRANSMISSION ...\" rows=\"4\" style=\"background:#0b0a09; border:1px solid #2a2622; color:#e8d5c0; font-size:13px; letter-spacing:1.5px; padding:14px 16px; outline:none; resize:vertical;\" style-focus=\"border-color:var(--accent,#ff7a1a);\"><\u002Ftextarea>\n              <button type=\"submit\" data-comment-anchor=\"8813199fda-a\" style=\"background:var(--accent,#ff7a1a); border:none; cursor:pointer; color:#0a0a0a; font-family:inherit; font-weight:700; letter-spacing:3px; font-size:14px; padding:16px 36px; transition:box-shadow .25s ease, transform .25s ease;\" style-hover=\"box-shadow:0 0 40px color-mix(in srgb, var(--accent,#ff7a1a) 60%, transparent); transform:translateY(-2px);\">// TRANSMIT →<\u002Fbutton>\n              <div id=\"ak-form-status\" style=\"font-size:11px; letter-spacing:2px; color:#5a554e; text-align:center;\">// SECURE DROP — ROUTES TO EMAIL UNTIL NOTION UPLINK GOES LIVE<\u002Fdiv>\n            <\u002Fform>\n            <div style=\"display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:26px;\">\n              <a href=\"mailto:contact@4alkubati.com\" style=\"font-size:12px; letter-spacing:2px; color:#8a8178; border:1px solid #2a2622; padding:9px 16px; transition:border-color .25s ease, color .25s ease;\" style-hover=\"border-color:var(--accent,#ff7a1a); color:var(--accent,#ff7a1a);\">EMAIL<\u002Fa>\n              <a href=\"https://github.com/4alkubati\" style=\"font-size:12px; letter-spacing:2px; color:#8a8178; border:1px solid #2a2622; padding:9px 16px; transition:border-color .25s ease, color .25s ease;\" style-hover=\"border-color:var(--accent,#ff7a1a); color:var(--accent,#ff7a1a);\">GITHUB<\u002Fa>\n              <a href=\"https://4alkubati.com\" style=\"font-size:12px; letter-spacing:2px; color:#8a8178; border:1px solid #2a2622; padding:9px 16px; transition:border-color .25s ease, color .25s ease;\" style-hover=\"border-color:var(--accent,#ff7a1a); color:var(--accent,#ff7a1a);\">4ALKUBATI.COM<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FOOTER -->\n    <footer style=\"border-top:1px solid #1c1a18; padding:26px 0 90px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;\">\n      <span style=\"font-size:11px; letter-spacing:2px; color:#5a554e;\">© 2026 AMR AL-KUBATI<\u002Fspan>\n      <span style=\"font-size:11px; letter-spacing:2px; color:#3a3530;\">// PSST — TYPE \"TERMINAL\"<\u002Fspan>\n      <span style=\"font-size:11px; letter-spacing:2px; color:var(--accent,#ff7a1a);\">// END OF FILE<\u002Fspan>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n\n  <!-- COMMS PROMPT (the site answers) -->\n  <div style=\"position:fixed; left:16px; bottom:16px; z-index:8500;\">\n    <div id=\"ak-comms-panel\" style=\"display:none; width:min(360px,86vw); border:1px solid #241f1b; background:rgba(10,9,8,.96); backdrop-filter:blur(4px); padding:14px 14px 12px; margin-bottom:8px;\">\n      <div style=\"font-size:10px; letter-spacing:2px; color:#5a554e; margin-bottom:8px;\">COMMS UPLINK — ASK ME SOMETHING<\u002Fdiv>\n      <div id=\"ak-comms-log\" style=\"font-size:12px; line-height:1.8; color:#9a9087; max-height:190px; overflow:auto;\">&gt; channel open. type 'help'<\u002Fdiv>\n      <div style=\"display:flex; gap:8px; margin-top:10px; align-items:center; border-top:1px solid #1c1a18; padding-top:10px;\">\n        <span style=\"color:var(--accent,#ff7a1a); font-size:13px;\">&gt;<\u002Fspan>\n        <input id=\"ak-comms-in\" onkeydown=\"{{ commsKey }}\" placeholder=\"help / whoami / terminal ...\" style=\"flex:1; background:transparent; border:none; outline:none; color:#e8d5c0; font-size:13px; letter-spacing:1px;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button id=\"ak-comms-toggle\" onclick=\"{{ toggleComms }}\" style=\"background:rgba(10,9,8,.92); border:1px solid color-mix(in srgb,var(--accent,#ff7a1a) 45%, transparent); color:var(--accent,#ff7a1a); font-family:inherit; font-size:11px; letter-spacing:3px; padding:11px 18px; cursor:pointer; transition:background .2s ease, color .2s ease;\" style-hover=\"background:var(--accent,#ff7a1a); color:#0a0a0a;\">[ COMMS ]<\u002Fbutton>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accent&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;#ff7a1a&quot;, &quot;options&quot;: [&quot;#c45c00&quot;, &quot;#ff7a1a&quot;, &quot;#00ff88&quot;, &quot;#4aa3ff&quot;, &quot;#e23b3b&quot;], &quot;tsType&quot;: &quot;string&quot; },\n  &quot;enableBoot&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },\n  &quot;showScanlines&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },\n  &quot;liveTelemetry&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },\n  &quot;notionEndpoint&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Integrations&quot; }\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const projects = [\n      { op: 'OP-01', cat: 'ENTREPRENEURSHIP', name: 'Swing By', desc: 'Service marketplace connecting clients to professionals across any category. Mobile-first, built from scratch.', status: 'LIVE', statusColor: '#00ff88', statusBorder: 'rgba(0,255,136,.3)', stack: 'React Native · Node · Postgres', mission: 'Match any client to any pro in minutes', outcome: 'Live product, growing user base', span: 'auto' },\n      { op: 'OP-02', cat: 'DEVELOPMENT', name: 'Automation Business', desc: 'End-to-end workflow automation solutions for small businesses. First venture into tech.', status: 'ACTIVE', statusColor: 'var(--accent,#ff7a1a)', statusBorder: 'color-mix(in srgb,var(--accent,#ff7a1a) 40%, transparent)', stack: 'Python · APIs · n8n / Zapier', mission: 'Kill repetitive work for SMBs', outcome: 'Recurring clients, first revenue', span: 'auto' },\n      { op: 'OP-03', cat: 'CYBERSECURITY', name: 'Security Lab', desc: 'Self-directed research, CTF practice, network scanning, and vulnerability analysis. Ongoing.', status: 'ONGOING', statusColor: '#ffcc00', statusBorder: 'rgba(255,204,0,.3)', stack: 'Kali · Nmap · Burp · Wireshark', mission: 'Break systems to learn defense', outcome: 'CTF ranks + 7 certifications', span: 'auto' },\n      { op: 'OP-04', cat: 'WEB DEVELOPMENT', name: 'Greenland Lawn Care', desc: 'Full business website for a local lawn care company. Clean design, service listings, and online booking.', status: 'SHIPPED', statusColor: '#00ff88', statusBorder: 'rgba(0,255,136,.3)', stack: 'HTML/CSS/JS · Booking flow', mission: 'Real client, real deadline', outcome: 'Delivered · client booked solid', span: 'auto' },\n      { op: 'OP-05', cat: 'DEV · OPS', name: 'This Portfolio', desc: 'Designed and deployed from scratch. Custom domain, Cloudflare CDN, GitHub Pages. Zero cost.', status: 'DEPLOYED', statusColor: '#00ff88', statusBorder: 'rgba(0,255,136,.3)', stack: 'Static · Cloudflare · GH Pages', mission: 'Elite presence at $0/mo', outcome: 'You are looking at it', span: '1 / -1' }\n    ];\n    const toolbox = [\n      { group: 'OFFENSE', tag: 'RED', tools: ['Nmap', 'Burp Suite', 'Metasploit', 'SQLMap', 'Hydra', 'ffuf'] },\n      { group: 'ANALYSIS & DEFENSE', tag: 'BLUE', tools: ['Wireshark', 'tcpdump', 'OSINT / Recon', 'Log Analysis', 'Threat Modeling'] },\n      { group: 'DEV & AUTOMATION', tag: 'BUILD', tools: ['Python', 'Bash', 'JavaScript / React', 'REST APIs', 'n8n / Zapier', 'Git'] },\n      { group: 'INFRASTRUCTURE', tag: 'OPS', tools: ['Linux', 'Cloudflare', 'DNS / CDN', 'GitHub Actions', 'Docker'] }\n    ];\n    const reports = [\n      { id: 'FR-01', tag: 'CTF WRITEUP', status: 'DRAFT', title: 'Chaining LFI → RCE on a Hardened Web Target', excerpt: 'Local file inclusion to log poisoning to a root shell — including the three dead ends along the way.', meta: 'HARD · 8 MIN READ' },\n      { id: 'FR-02', tag: 'TOOLING', status: 'DRAFT', title: 'Zero-Cost Recon Pipeline: Python + Cloudflare Workers', excerpt: 'Subdomain enum, live-host filtering, and screenshotting wired end-to-end on a scheduled Worker — no server, no bill.', meta: 'OSINT · CI · 6 MIN READ' },\n      { id: 'FR-03', tag: 'AD / PRIV-ESC', status: 'DRAFT', title: 'From LDAP Read to Domain Admin', excerpt: 'Turning a low-priv AD account f (e.key === 'Enter') this.runCommand(e.target); },\n      sendTransmission: (e) => {\n        e.preventDefault();\n        const f = e.currentTarget;\n        const status = document.getElementById('ak-form-status');\n        const data = { callsign: f.callsign.value, channel: f.channel.value, msg: f.msg.value, ts: new Date().toISOString() };\n        const endpoint = this.props.notionEndpoint ?? '';\n        const done = () => {\n          if (status) { status.textContent = '// TRANSMISSION LOGGED — EXPECT A RESPONSE ON YOUR RETURN CHANNEL'; status.style.color = '#00ff88'; }\n          f.reset();\n        };\n        if (endpoint) {\n          fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })\n            .then(done)\n            .catch(() => { if (status) { status.textContent = '// UPLINK FAILED — FALLING BACK TO EMAIL'; status.style.color = '#ff3a3a'; } window.location.href = this.mailtoFallback(data); });\n        } else {\n          window.location.href = this.mailtoFallback(data);\n          done();\n        }\n      }\n    };\n  }\n\n  mailtoFallback(d) {\n    return 'mailto:contact@4alkubati.com?subject=' + encodeURIComponent('[TRANSMISSION] from ' + d.callsign) + '&body=' + encodeURIComponent(d.msg + '\\n\\n— ' + d.callsign + ' · ' + d.channel);\n  }\n\n  commsPrint(text, color) {\n    const log = document.getElementById('ak-comms-log');\n    if (!log) return;\n    const d = document.createElement('div');\n    d.textContent = text;\n    if (color) d.style.color = color;\n    log.appendChild(d);\n    log.scrollTop = log.scrollHeight;\n  }\n\n  revealTerminal(announce) {\n    const sec = document.getElementById('terminal');\n    if (!sec || sec.style.display !== 'none') { if (announce) this.commsPrint('> already unlocked. scrolling.', '#00ff88'); }\n    else {\n      sec.style.display = 'block';\n      const inner = sec.querySelector('[data-reveal]');\n      if (inner) { inner.style.opacity = '1' onst sc = $('ak-scan'); if (sc) sc.style.display = 'none'; }\n\n    // ---- animated background: drifting node network + radar sweep ----\n    const cv = $('ak-bg');\n    if (cv && !reduced) {\n      const ctx = cv.getContext('2d');\n      let W, H, pts;\n      const accent = () => (getComputedStyle(cv.parentElement).getPropertyValue('--accent') || '#ff7a1a').trim();\n      const resize = () => {\n        const dpr = Math.min(window.devicePixelRatio || 1, 2);\n        W = window.innerWidth; H = window.innerHeight;\n        cv.width = W * dpr; cv.height = H * dpr;\n        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n        const n = W < 640 ? 36 : 70;\n        pts = Array.from({ length: n }, () => ({\n          x: Math.random() * W, y: Math.random() * H,\n          vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22,\n          r: Math.random() * 1.4 + .4\n        }));\n      };\n      resize();\n      this._onResize = resize;\n      window.addEventListener('resize', resize);\n      let sweep = 0;\n      const draw = () => {\n        ctx.clearRect(0, 0, W, H);\n        const ac = accent();\n        // nodes + links\n        for (const p of pts) {\n          p.x += p.vx; p.y += p.vy;\n          if (p.x < 0 || p.x > W) p.vx *= -1;\n          if (p.y < 0 || p.y > H) p.vy *= -1;\n        }\n        ctx.lineWidth = 1;\n        for (let i = 0; i < pts.length; i++) {\n          for (let j = i + 1; j < pts.length; j++) {\n            const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;\n            const d2 = dx * dx + dy * dy;\n            if (d2 < 15000) {\n              ctx.globalAlpha = (1 - d2 / 15000) * .13;\n              ctx.strokeStyle = ac;\n              ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();\n            }\n          }\n        }\n        for (const p of pts) {\n          ctx.globalAlpha = .35;\n          ctx.fillStyle = ac;\n          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ct
